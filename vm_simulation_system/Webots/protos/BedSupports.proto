#VRML_SIM R2021a utf8

PROTO BedSupports [
  field SFVec3f    translation -0.646 0.433 0.899
  field SFRotation rotation    0 1 0 0
  field SFString   name        "Bed_Supports"
  
  field SFVec3f    boxSize     0.0126 0.0333 0.0126
  field SFVec3f    meshTranslation -0.15 0.55 -0.065
  field SFVec3f    boxTranslation  0 0 0
  


  field SFColor    baseColor   0.1 0.1 0.1
  field SFFloat    roughness   0.5
  field SFFloat    metalness   0.8
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    
    # 1. VISUALS 
    children [
      Transform {
        translation IS meshTranslation
        scale 0.001 0.001 0.001
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS baseColor
              roughness IS roughness
              metalness IS metalness
            }
            geometry Mesh {
              url [
                "meshes/Printerbedsupports(no_plate).stl" 
              ]
            }
          }
        ]
      }
    ]
    
    # 2. COLLISIONS
    boundingObject Transform {
      translation IS boxTranslation
      children [
        Box {
          size IS boxSize
        }
      ]
    }
  }
}
